<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 3R5 ProMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-slate-900 p-8 rounded-xl border border-slate-800 shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-block bg-blue-600 p-3 rounded-lg text-white mb-4">
                <i class="fas fa-lock text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Acceso Privado</h2>
            <p class="text-slate-400 text-sm mt-2">Ingresa tus credenciales para continuar.</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-slate-300 text-sm mb-1">Correo Electrónico</label>
                <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-slate-300 text-sm mb-1">Contraseña</label>
                <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
            
            <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition mt-4">
                Iniciar Sesión
            </button>
            
            <div id="error-msg" class="hidden p-3 bg-red-900/50 border border-red-600 text-red-200 text-sm rounded-lg text-center"></div>
        </form>
    </div>

    <!-- Firebase SDK (Versión Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

        // Tu configuración exacta de Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyCdH-F-q7v5MSel-M7VYOf7aYusNYwKrxU",
          authDomain: "r5promaster.firebaseapp.com",
          projectId: "r5promaster",
          storageBucket: "r5promaster.firebasestorage.app",
          messagingSenderId: "63034955652",
          appId: "1:63034955652:web:0ae66dfba8a8b8f32befd1",
          measurementId: "G-M2QFBMMS3T"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const btnLogin = document.getElementById('btn-login');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            btnLogin.disabled = true;
            btnLogin.textContent = "Verificando...";
            errorMsg.classList.add('hidden');

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    window.location.href = "panel-privado.html"; 
                })
                .catch((error) => {
                    errorMsg.classList.remove('hidden');
                    errorMsg.textContent = "Correo o contraseña incorrectos.";
                    btnLogin.disabled = false;
                    btnLogin.textContent = "Iniciar Sesión";
                });
        });
    </script>
</body>
</html>
